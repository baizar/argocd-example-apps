apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/baizar/argocd-example-apps.git
    targetRevision: HEAD
    path: helm-guestbook
    valuesFiles:
      - values-production.yaml
  destination: 
    server: https://kubernetes.default.svc
    namespace: default

